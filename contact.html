<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <title>Contact | Discover Galway</title>
  <meta name="description" content="Contact Discover Galway with a travel, booking or general enquiry about Galway City and Connemara.">
</head>
<body>
  <header>
    <h1>Discover Galway</h1>
    <p>Galway City and Connemara</p>
  </header>
  <nav class="d-flex flex-wrap justify-content-center gap-3" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="experiences.html">Experiences</a>
    <a href="plan.html">Plan Your Trip</a>
    <a href="contact.html">Contact</a>
  </nav>
<main class="container">
  <h2>Contact and booking enquiries</h2>
  <p>Complete the form below to check your enquiry details. All fields are required.</p>
  <form id="enquiryForm" onsubmit="return validateForm()" novalidate>
    <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" type="text" id="name" name="name" autocomplete="name" required aria-describedby="nameError"><p class="field-error" id="nameError"></p></div>
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required aria-describedby="emailError"><p class="field-error" id="emailError"></p></div>
    <div class="mb-3"><label class="form-label" for="phone">Phone number</label><input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required aria-describedby="phoneError"><p class="field-error" id="phoneError"></p></div>
    <div class="mb-3"><label class="form-label" for="queryType">Query type</label><select class="form-select" id="queryType" name="queryType" required aria-describedby="queryTypeError"><option value="">Choose a query type</option><option value="Booking">Booking</option><option value="Payment">Payment</option><option value="General Information">General Information</option><option value="Other">Other</option></select><p class="field-error" id="queryTypeError"></p></div>
    <div class="mb-3"><label class="form-label" for="message">Message (at least 20 characters)</label><textarea class="form-control" id="message" name="message" rows="5" minlength="20" required aria-describedby="messageError"></textarea><p class="field-error" id="messageError"></p></div>
    <button class="btn btn-success" type="submit">Check enquiry</button>
    <p id="formResponse" role="status" aria-live="polite" class="mt-3"></p>
  </form>
  <p>This is a practice form. It does not send or save your details.</p>
</main>
  <footer><p>&copy; 2026 Discover Galway</p></footer>
</body>
</html>
